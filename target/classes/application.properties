spring.application.name=cozy-heaven-backend
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Database ──────────────────────────────────────────────────────────────────
# On Render, set these as Environment Variables in the dashboard:
#   DB_URL      e.g.  jdbc:mysql://<host>:3306/cozyheaven
#   DB_USERNAME e.g.  root
#   DB_PASSWORD e.g.  your_password
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cozyheaven}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUQXV0aGVudGljYXRpb24xMjM0NTY3ODkw}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Keep-alive cron (self-ping URL) ──────────────────────────────────────────
# On Render, set APP_SELF_PING_URL to your service's public URL, e.g.:
#   https://cozy-heaven-backend.onrender.com/
app.self-ping-url=${APP_SELF_PING_URL:http://localhost:8080/}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{36} - %msg%n
